[package]
authors = ["Ash Vardanian"]
categories = ["algorithms", "mathematics", "science"]
description = "Mixed-precision numerics benchmarks: NumKong vs competitors"
edition = "2021"
keywords = ["benchmark", "simd", "numerical", "performance"]
license = "Apache-2.0"
name = "numwars"
repository = "https://github.com/ashvardanian/NumWars"
rust-version = "1.75.0"
version = "0.1.0"

[dependencies]
criterion = {version = "0.8", default-features = false}
half = {version = "2.4", optional = true}
num-traits = {version = "0.2", optional = true}
num_cpus = "1.16"
numkong = {version = "7.0.0", default-features = false}
rand = {version = "0.10", optional = true}
regex = "1.11"

# Competitors (all optional)
argminmax = {version = "0.6", optional = true, default-features = false, features = ["float"]}
faer = {version = "0.24", optional = true}
geo = {version = "0.32", optional = true}
matrixmultiply = {version = "0.3", optional = true}
nalgebra = {version = "0.34", optional = true}
ndarray = {version = "0.17", optional = true}
polars = {version = "0.53", optional = true, default-features = false, features = ["lazy"]}
wide = {version = "1.1", optional = true}

[features]
all = ["bench_similarity", "bench_each", "bench_dots", "bench_geospatial", "bench_similarities", "bench_maxsim", "bench_reduce", "bench_mesh"]
bench_dots = ["rand", "ndarray", "nalgebra", "faer", "half", "matrixmultiply", "num-traits"]
bench_each = ["rand", "num-traits", "half", "ndarray", "wide", "nalgebra"]
bench_geospatial = ["rand", "num-traits", "geo"]
bench_maxsim = ["rand", "num-traits", "half", "ndarray", "nalgebra"]
bench_mesh = ["rand", "num-traits", "half", "nalgebra"]
bench_reduce = ["rand", "num-traits", "ndarray", "polars", "argminmax"]
bench_similarities = ["rand", "half", "num-traits", "ndarray", "nalgebra"]
bench_similarity = ["rand", "num-traits", "half", "ndarray", "nalgebra"]
default = []

[[bench]]
harness = false
name = "bench_similarity"
path = "similarity/bench.rs"
required-features = ["bench_similarity"]

[[bench]]
harness = false
name = "bench_each"
path = "each/bench.rs"
required-features = ["bench_each"]

[[bench]]
harness = false
name = "bench_dots"
path = "dots/bench.rs"
required-features = ["bench_dots"]

[[bench]]
harness = false
name = "bench_geospatial"
path = "geospatial/bench.rs"
required-features = ["bench_geospatial"]

[[bench]]
harness = false
name = "bench_similarities"
path = "similarities/bench.rs"
required-features = ["bench_similarities"]

[[bench]]
harness = false
name = "bench_maxsim"
path = "maxsim/bench.rs"
required-features = ["bench_maxsim"]

[[bench]]
harness = false
name = "bench_reduce"
path = "reduce/bench.rs"
required-features = ["bench_reduce"]

[[bench]]
harness = false
name = "bench_mesh"
path = "mesh/bench.rs"
required-features = ["bench_mesh"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.bench]
inherits = "release"
