[package]
name = "numwars"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
license = "Apache-2.0"
authors = ["NumWars Contributors"]
description = "Mixed-precision numerics benchmarks: NumKong vs competitors"
repository = "https://github.com/ashvardanian/NumWars"
keywords = ["benchmark", "simd", "numerical", "performance"]
categories = ["algorithms", "mathematics", "science"]

[dependencies]
criterion = { version = "0.5", default-features = false }
numkong = { path = "../SimSIMD", default-features = false }
rand = { version = "0.8", optional = true }
num-traits = { version = "0.2", optional = true }
half = { version = "2.4", optional = true }
regex = "1.11"
num_cpus = "1.16"

# Competitors (all optional)
ndarray = { version = "0.16", optional = true }
nalgebra = { version = "0.33", optional = true }
faer = { version = "0.19", optional = true }
fork_union = { version = "2.3", optional = true }

[features]
default = []
bench_similarity = ["rand", "num-traits", "half"]
bench_each = ["rand", "num-traits", "half"]
bench_dots = ["rand", "fork_union", "ndarray", "nalgebra", "faer", "half"]
all = ["bench_similarity", "bench_each", "bench_dots"]

[[bench]]
name = "bench_similarity"
path = "similarity/bench.rs"
harness = false
required-features = ["bench_similarity"]

[[bench]]
name = "bench_each"
path = "each/bench.rs"
harness = false
required-features = ["bench_each"]

[[bench]]
name = "bench_dots"
path = "dots/bench.rs"
harness = false
required-features = ["bench_dots"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
